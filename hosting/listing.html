<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SLSU-GumaCart listing</title>
  <meta property="og:title" content="A listing on SLSU-GumaCart">
  <meta property="og:description" content="Tap to view it in the GumaCart app, the campus marketplace of SLSU Gumaca.">
  <meta property="og:image" content="https://gumacartfinal.web.app/icon.png">
  <meta name="theme-color" content="#1B6B3A">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #F6FAF7; font-family: system-ui, sans-serif; color: #1F2D24; }
    main { max-width: 340px; padding: 32px 24px; text-align: center; }
    img { width: 96px; height: 96px; border-radius: 24px; }
    h1 { font-size: 22px; margin: 18px 0 8px; }
    p { font-size: 15px; line-height: 1.5; color: #5B6B60; margin: 0 0 22px; }
    a.btn { display: block; padding: 15px; border-radius: 14px; background: #1B6B3A; color: #fff;
            font-weight: 700; font-size: 16px; text-decoration: none; }
    small { display: block; margin-top: 18px; font-size: 13px; color: #8A988E; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <img src="/icon.png" alt="GumaCart">
    <h1>Open in GumaCart</h1>
    <p>This listing is on SLSU-GumaCart, the campus marketplace for SLSU Gumaca students and faculty.</p>
    <a class="btn" id="open" href="#">Open the listing</a>
    <small id="note">Don't have the app yet? Ask a friend or the GumaCart team for it.</small>
  </main>
  <script>
    // /listing/<id> → the app's own link, gumacart://listing/<id>.
    var id = (location.pathname.split('/listing/')[1] || '').split('/')[0];
    if (!/^[A-Za-z0-9_-]+$/.test(id)) id = '';
    var appLink = id ? 'gumacart://listing/' + id : 'gumacart://';
    var isAndroid = /Android/i.test(navigator.userAgent);
    var noApp = /[?&]noapp=1/.test(location.search);
    // On Android, an intent link opens the app, or comes back here with
    // ?noapp=1 when it isn't installed.
    var href = isAndroid
      ? 'intent://' + (id ? 'listing/' + id : '') + '#Intent;scheme=gumacart;package=com.omargerez.gumacart;S.browser_fallback_url='
        + encodeURIComponent(location.origin + location.pathname + '?noapp=1') + ';end'
      : appLink;
    document.getElementById('open').href = href;
    if (noApp) {
      document.getElementById('note').textContent = 'GumaCart isn’t installed on this phone. Ask a friend or the GumaCart team for the app, then tap the link again.';
    } else if (isAndroid) {
      location.replace(href);
    }
  </script>
</body>
</html>
